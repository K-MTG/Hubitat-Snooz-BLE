# Explicit project name: the default is the directory name (ble_ws_service), which the
# hubitat-august-ble service also uses, so on a shared host `down`/--remove-orphans
# in one checkout could remove the other's container.
name: snooz-ble-ws-service

services:
  snooz-ble-ws-service:
    build: .
    container_name: snooz-ble-ws-service
    restart: unless-stopped
    # SIGTERM makes the service disconnect each Snooz; a SIGKILL after the default 10s
    # would leave the BLE link open in bluetoothd and the device would stop advertising.
    stop_grace_period: 30s
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /var/run/dbus:/var/run/dbus
    network_mode: host
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # Limit each log file to 10MB
        max-file: "3"    # Keep only 3 log files before rotating
